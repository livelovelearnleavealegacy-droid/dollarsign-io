name: Orphan cleanup

# Deletes page images and source PDFs that no envelope references.
#
# Runs weekly and deletes for real. Manual runs stay a DRY RUN unless
# you tick the box, so you can always look before touching anything.
#
# It was manual-only until Sept 10, on the reasoning that a job which
# deletes customer files should be watched before it is trusted. It has
# since been watched: asked to sweep, it correctly refused every one of
# 310 unreferenced files because all of them were younger than the age
# floor. That is the behaviour worth trusting, so it now runs on its own.
#
# Files newer than the minimum age are never touched. A page image is
# written BEFORE the envelope that references it exists, so a recent
# unreferenced file is not garbage, it is a document somebody is in the
# middle of preparing.
#
# Requires the ADMIN_TOKEN repository secret.
on:
  schedule:
    # Wednesdays 09:00 UTC. Deliberately away from the Monday jobs, so a
    # bad week doesn't arrive as three red emails at once.
    - cron: "0 9 * * 3"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually delete (unticked = dry run, deletes nothing)"
        required: false
        type: boolean
        default: false
      min_age_days:
        description: "Only touch orphans older than this many days"
        required: false
        default: "7"

jobs:
  cleanup:
    name: Sweep orphaned files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run cleanup
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # Scheduled runs delete; manual runs only do so if the box is
          # ticked. Written as an explicit event check rather than a
          # fallback, because the input is a real boolean here — an
          # unticked box is false, and a fallback would have quietly
          # turned every careful dry run into a live delete.
          APPLY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.apply }}
          MIN_AGE: ${{ github.event.inputs.min_age_days }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN secret is not set."
            exit 1
          fi

          QS="minAgeDays=${MIN_AGE:-7}"
          if [ "$APPLY" = "true" ]; then
            QS="$QS&apply=1"
            echo "APPLY MODE — files will be deleted."
          else
            echo "DRY RUN — nothing will be deleted."
          fi

          CODE=$(curl -sS -o /tmp/cleanup.json -w '%{http_code}' --max-time 120 \
            -X POST -H "x-admin-token: $ADMIN_TOKEN" \
            "https://dollarsign.io/api/admin/cleanup?$QS" || echo "000")

          echo "--- result ---"
          cat /tmp/cleanup.json
          echo ""

          if [ "$CODE" != "200" ]; then
            echo "Cleanup endpoint returned HTTP $CODE."
            exit 1
          fi

          # A readable summary, so the weekly email says something
          # useful without anybody opening the run.
          node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/cleanup.json", "utf8"));
            console.log(r.mode);
            console.log("page images : " + r.pageImages.deleted + " deleted, " + r.pageImages.skippedTooNew + " too new");
            console.log("source PDFs : " + r.sourcePdfs.deleted + " deleted, " + r.sourcePdfs.skippedTooNew + " too new");
            console.log("space freed : " + r.totalFreedMb + " MB");
            const errs = [].concat(r.pageImages.errors || [], r.sourcePdfs.errors || []);
            if (errs.length) { console.log("ERRORS:"); errs.forEach(e => console.log("  " + e)); process.exit(1); }
          '
